name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@^11.15.0

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm publish --access public --tag="$NPM_TAG" --provenance
        env:
          NPM_TAG: ${{ github.event_name == 'release' && github.event.release.prerelease && 'beta' || 'latest' }}
